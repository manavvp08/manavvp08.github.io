<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">BotX.ai project graphic</title>
  <desc id="desc">A stylized browser window connected to an AI command prompt.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10131b"/>
      <stop offset="1" stop-color="#242a3b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" rx="48" fill="url(#bg)"/>
  <circle cx="1120" cy="120" r="180" fill="#5b8cff" opacity=".09"/>
  <circle cx="120" cy="650" r="230" fill="#8b5cf6" opacity=".08"/>
  <rect x="150" y="130" width="980" height="460" rx="28" fill="#0b0d13" stroke="#4a536b" stroke-width="3"/>
  <path d="M150 205h980" stroke="#4a536b" stroke-width="3"/>
  <circle cx="195" cy="168" r="10" fill="#ff6b6b"/>
  <circle cx="227" cy="168" r="10" fill="#ffd166"/>
  <circle cx="259" cy="168" r="10" fill="#6ee7a8"/>
  <rect x="210" y="265" width="370" height="210" rx="24" fill="#151a25" stroke="#343b50" stroke-width="2"/>
  <text x="260" y="345" fill="#9ca7c4" font-family="Arial, sans-serif" font-size="24">Tell BotX what you need</text>
  <text x="260" y="405" fill="#f7f8fb" font-family="Arial, sans-serif" font-size="32" font-weight="700">“Open my next task”</text>
  <rect x="260" y="435" width="150" height="8" rx="4" fill="url(#accent)"/>
