  <path d="m715 340 34 30-34 30" fill="none" stroke="#5b8cff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="785" y="255" width="255" height="230" rx="24" fill="#151a25" stroke="#343b50" stroke-width="2"/>
  <circle cx="912" cy="338" r="58" fill="url(#accent)"/>
  <path d="M887 338h50M912 313v50" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
  <text x="848" y="438" fill="#f7f8fb" font-family="Arial, sans-serif" font-size="34" font-weight="700">Action</text>
  <text x="150" y="650" fill="#f7f8fb" font-family="Arial, sans-serif" font-size="44" font-weight="700">BotX.ai</text>
  <text x="340" y="650" fill="#9ca7c4" font-family="Arial, sans-serif" font-size="26">Natural language → tangible web action</text>
